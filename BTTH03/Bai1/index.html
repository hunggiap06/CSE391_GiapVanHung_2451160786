<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên - K66</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Hệ thống Quản lý Sinh viên (K66 - BTTH03)</h2>
        <div class="statistics-box">
            <div class="stat-item">Tổng số sinh viên: <span id="total-students">0</span></div>
            <div class="stat-item">Điểm trung bình lớp: <span id="average-score">0.0</span></div>
        </div>
        <div class="action-bar">
            <button id="btn-open-form" class="btn btn-primary">+ Thêm sinh viên mới</button>
            <div id="toast-msg" class="toast-hidden"></div>
        </div>
        <table class="student-table">
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp học</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="student-list"></tbody>
        </table>
    </div>

    <div id="student-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title">Thêm Sinh Viên Mới</h3>
            <form id="student-form">
                <input type="hidden" id="form-mode" value="">
                <div class="form-group"><label>Mã SV:</label><input type="text" id="student-id"></div>
                <div class="form-group"><label>Họ tên:</label><input type="text" id="student-name"></div>
                <div class="form-group"><label>Ngày sinh:</label><input type="date" id="student-dob"></div>
                <div class="form-group"><label>Lớp:</label><input type="text" id="student-class"></div>
                <div class="form-group"><label>Điểm TB:</label><input type="number" id="student-gpa" step="0.1"></div>
                <div class="form-group"><label>Email:</label><input type="email" id="student-email"></div>
                <div class="modal-actions">
                    <button type="button" id="btn-close-form" class="btn btn-secondary">Hủy</button>
                    <button type="submit" id="btn-submit-form" class="btn btn-success">Lưu</button>
                </div>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
