<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Đặt hàng</title>
</head>

<body>

<h1>Form Đặt hàng</h1>

<form action="#" method="POST">

<!-- PHẦN 1: GIỎ HÀNG -->

<h2>Giỏ hàng</h2>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>STT</th>
            <th>Sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>1</td>
            <td>iPhone 16 Pro</td>
            <td>25.000.000đ</td>
            <td>1</td>
            <td>25.000.000đ</td>
        </tr>

        <tr>
            <td>2</td>
            <td>AirPods Pro</td>
            <td>6.000.000đ</td>
            <td>1</td>
            <td>6.000.000đ</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Apple Watch</td>
            <td>8.000.000đ</td>
            <td>1</td>
            <td>8.000.000đ</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="4"><strong>Tổng cộng</strong></td>
            <td><output>39.000.000đ</output></td>
        </tr>
    </tfoot>
</table>

<br>

<!-- BONUS: datalist -->
<label for="search">Tìm thêm sản phẩm:</label>
<input list="products" id="search" placeholder="Nhập tên sản phẩm">

<datalist id="products">
    <option value="iPhone 16 Pro">
    <option value="MacBook Air M3">
    <option value="iPad Pro">
    <option value="AirPods Pro">
</datalist>

<hr>

<!-- PHẦN 2: THANH TOÁN -->

<fieldset>
<legend>Thanh toán</legend>

<p>Phương thức thanh toán:</p>

<input type="radio" id="cod" name="payment" value="COD" required>
<label for="cod">COD</label>

<input type="radio" id="bank" name="payment" value="bank">
<label for="bank">Chuyển khoản</label>

<input type="radio" id="wallet" name="payment" value="wallet">
<label for="wallet">Ví điện tử</label>

<br><br>

<label for="coupon">Mã giảm giá:</label><br>
<input
    type="text"
    id="coupon"
    name="coupon"
    placeholder="SALE2026"
    pattern="SALE[0-9]{4}">

<br><br>

<label for="note">Ghi chú:</label><br>
<textarea
    id="note"
    name="note"
    rows="3"
    placeholder="Ghi chú thêm cho đơn hàng"></textarea>

</fieldset>

<hr>


<!-- PHẦN 3: GIAO HÀNG -->
<fieldset>
<legend>Thông tin giao hàng</legend>

<label for="delivery">Ngày giao hàng mong muốn:</label><br>
<input
    type="date"
    id="delivery"
    name="delivery"
    min="2026-05-06"
    required>

<br><br>

<label for="time">Khung giờ:</label><br>
<select id="time" name="time" required>
    <option value="">-- Chọn khung giờ --</option>
    <option>Sáng 8-12h</option>
    <option>Chiều 14-18h</option>
    <option>Tối 18-21h</option>
</select>

<br><br>

<label for="days">Thời gian giao hàng (ngày):</label><br>
<input
    type="range"
    id="days"
    name="days"
    min="1"
    max="7"
    step="1">

<br><br>

<!-- BONUS: meter -->
<label for="point">Điểm tích lũy:</label><br>
<meter id="point" min="0" max="100" value="60">60%</meter>

</fieldset>

<br>

<button type="submit" aria-label="Xác nhận đặt hàng">
    Xác nhận đặt hàng
</button>

<button type="reset">Nhập lại</button>

</form>

</body>
</html>
