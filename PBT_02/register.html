<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
</head>

<body>

<h1>Đăng ký tài khoản E-Commerce</h1>

<form action="#" method="POST">

    <fieldset>
        <legend>Thông tin cá nhân</legend>

        <label for="fullname">Họ tên:</label><br>
        <input 
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Nhập họ và tên"
            required
            minlength="2"
            maxlength="50"><br><br>

        <label for="email">Email:</label><br>
        <input 
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required><br><br>

        <label for="phone">Số điện thoại:</label><br>
        <input 
            type="tel"
            id="phone"
            name="phone"
            placeholder="0123456789"
            pattern="[0-9]{10}"
            required><br><br>

        <label for="birth">Ngày sinh:</label><br>
        <input 
            type="date"
            id="birth"
            name="birth"
            max="2026-05-05"
            required><br><br>

    </fieldset>

    <fieldset>
        <legend>Tài khoản</legend>

        <label for="username">Username:</label><br>
        <input 
            type="text"
            id="username"
            name="username"
            placeholder="3-20 ký tự (a-z, 0-9, _)"
            pattern="^[a-zA-Z0-9_]{3,20}$"
            required><br><br>

        <label for="password">Password:</label><br>
        <input 
            type="password"
            id="password"
            name="password"
            placeholder="Ít nhất 8 ký tự, 1 chữ hoa, 1 số"
            minlength="8"
            pattern="^(?=.*[A-Z])(?=.*[0-9]).{8,}$"
            required><br><br>

        <label for="confirm">Xác nhận password:</label><br>
        <input 
            type="password"
            id="confirm"
            name="confirm"
            placeholder="Nhập lại mật khẩu"
            minlength="8"
            required><br><br>

    </fieldset>

    <fieldset>
        <legend>Thông tin giao hàng</legend>

        <label for="city">Thành phố:</label><br>
        <select id="city" name="city" required>
            <option value="">-- Chọn thành phố --</option>
            <option>Hà Nội</option>
            <option>TP Hồ Chí Minh</option>
            <option>Đà Nẵng</option>
            <option>Hải Phòng</option>
            <option>Cần Thơ</option>
        </select><br><br>

        <label for="district">Quận/Huyện:</label><br>
        <select id="district" name="district" required>
            <option>Hoàn Kiếm</option>
            <option>Ba Đình</option>
            <option>Cầu Giấy</option>
            <option>Thanh Xuân</option>
            <option>Long Biên</option>
        </select><br><br>

        <label for="address">Địa chỉ chi tiết:</label><br>
        <textarea 
            id="address"
            name="address"
            rows="3"
            placeholder="Số nhà, tên đường..."
            required></textarea><br><br>

        <p>Giới tính:</p>

        <input type="radio" id="male" name="gender" value="Nam" required>
        <label for="male">Nam</label>

        <input type="radio" id="female" name="gender" value="Nữ">
        <label for="female">Nữ</label>

        <input type="radio" id="other" name="gender" value="Khác">
        <label for="other">Khác</label><br><br>

        <input type="checkbox" id="terms" required>
        <label for="terms">Tôi đồng ý điều khoản sử dụng</label>

    </fieldset>

    <br>

    <button type="submit">Đăng ký</button>
    <button type="reset">Nhập lại</button>

</form>

</body>
</html>
