<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài B2 - CSS Transitions & Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <!-- 4. Loading Spinner -->
    <div class="loader-container">
        <div class="spinner"></div>
        <p>Đang tải sản phẩm...</p>
    </div>

    <div class="container">
        <!-- 5. Fade-in Effect Container -->
        <div class="product-grid fadeIn-scroll">
            
            <!-- Product Card -->
            <div class="product-card">
                <!-- 3. Image Zoom Effect -->
                <div class="img-container">
                    <img src="https://picsum.photos/300/200" alt="Sản phẩm">
                </div>
                
                <div class="card-content">
                    <h3>Sản phẩm cao cấp</h3>
                    <p>Mô tả ngắn gọn về sản phẩm để kiểm tra hiệu ứng hover.</p>
                    <!-- 2. Button Hover Effect -->
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
