<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug CSS Layout</title>
    <link rel="stylesheet" href="debug_layout.css">
</head>
<body>

    <h2>Cách 1: Dùng border-box</h2>
    <div class="container clear">
        <div class="sidebar fix-1">Sidebar (Border-box)</div>
        <div class="content fix-1">Content (Border-box)</div>
    </div>

    <h2>Cách 2: Tính lại width (Không dùng border-box)</h2>
    <div class="container clear">
        <div class="sidebar fix-2">Sidebar (Tính lại width)</div>
        <div class="content fix-2">Content (Tính lại width)</div>
    </div>

</body>
</html>
